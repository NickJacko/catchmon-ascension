<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Status is never colour alone — always paired with a word" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:150px;box-sizing:border-box;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1}.chip{height:52px;border-radius:var(--radius-s);border:1px solid var(--border-hairline)}
.n{font:var(--type-label);color:var(--text-body);margin-top:6px;display:block}
.h{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle);display:block;margin-top:2px}
.tok{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="sw"><div><div class="chip" style="background:#65B97A"></div><span class="n">Success</span><span class="h">#65B97A</span></div><div><div class="chip" style="background:#E6A94C"></div><span class="n">Warning</span><span class="h">#E6A94C</span></div><div><div class="chip" style="background:#D96868"></div><span class="n">Error</span><span class="h">#D96868</span></div><div><div class="chip" style="background:#67A9D8"></div><span class="n">Info</span><span class="h">#67A9D8</span></div><div><div class="chip" style="background:#E6B958"></div><span class="n">Premium</span><span class="h">#E6B958</span></div><div><div class="chip" style="background:#8E8984"></div><span class="n">Disabled</span><span class="h">#8E8984</span></div></div></body></html>
