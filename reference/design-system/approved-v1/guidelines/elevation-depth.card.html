<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:170px;box-sizing:border-box;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1}.chip{height:52px;border-radius:var(--radius-s);border:1px solid var(--border-hairline)}
.n{font:var(--type-label);color:var(--text-body);margin-top:6px;display:block}
.h{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle);display:block;margin-top:2px}
.tok{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle)}
</style></head><body><div style="display:flex;gap:14px;align-items:center">

 <div style="flex:1;height:64px;background:var(--surface-slot);border:1px solid var(--border-hairline);border-radius:var(--radius-slot);box-shadow:var(--inset-slot)"></div>
 <div style="flex:1;display:flex;flex-direction:column;gap:8px">
 <div style="height:44px;background:var(--action-primary);border:1px solid var(--action-primary-press);border-radius:var(--radius-m);box-shadow:var(--depth-button)"></div>
 <div style="height:44px;background:var(--action-primary);border:1px solid var(--action-primary-press);border-radius:var(--radius-m);box-shadow:var(--depth-button-press);transform:translateY(2px)"></div>
 </div></div><span class="tok" style="display:block;margin-top:8px">--inset-panel · --inset-slot · --depth-button / --depth-button-press</span></body></html>
