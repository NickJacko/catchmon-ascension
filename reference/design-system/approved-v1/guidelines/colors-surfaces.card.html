<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="App ground, panels, cards and recessed slots" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:150px;box-sizing:border-box;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1}.chip{height:52px;border-radius:var(--radius-s);border:1px solid var(--border-hairline)}
.n{font:var(--type-label);color:var(--text-body);margin-top:6px;display:block}
.h{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle);display:block;margin-top:2px}
.tok{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="sw"><div><div class="chip" style="background:#F1E2C6"></div><span class="n">app</span><span class="h">--surface-app</span></div><div><div class="chip" style="background:#F5E8D2"></div><span class="n">panel</span><span class="h">--surface-panel</span></div><div><div class="chip" style="background:#FFF8EB"></div><span class="n">card</span><span class="h">--surface-card</span></div><div><div class="chip" style="background:#FFFDF7"></div><span class="n">raised</span><span class="h">--surface-raised</span></div><div><div class="chip" style="background:#E7D3B0"></div><span class="n">slot</span><span class="h">--surface-slot</span></div><div><div class="chip" style="background:#2E2A28"></div><span class="n">inverse</span><span class="h">--surface-inverse</span></div></div></body></html>
