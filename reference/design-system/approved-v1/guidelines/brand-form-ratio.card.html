<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:170px;box-sizing:border-box;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1}.chip{height:52px;border-radius:var(--radius-s);border:1px solid var(--border-hairline)}
.n{font:var(--type-label);color:var(--text-body);margin-top:6px;display:block}
.h{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle);display:block;margin-top:2px}
.tok{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle)}
</style></head><body><div style="display:flex;gap:10px;align-items:center;height:66px">
 <div style="flex:6.5;height:56px;border-radius:28px;background:var(--cs-warm-sand);border:2px solid var(--cs-walnut-800);display:grid;place-items:center;font:var(--type-label);color:var(--cs-walnut-800)">SOFT / ROUND 65%</div>
 <div style="flex:2.5;height:56px;background:var(--cs-muted-walnut);border:2px solid var(--cs-walnut-800);display:grid;place-items:center;font:var(--type-label);color:var(--cs-warm-white)">ANGULAR 25%</div>
 <div style="flex:1;height:56px;background:var(--cs-soft-gold);border:2px solid var(--cs-walnut-800);clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)"></div>
 </div><p style="margin:10px 0 0;font:var(--type-body);font-size:12px;color:var(--text-muted)">Round = shop, care, food. Angular = tools, stone, steel, expedition. Sharp = magic, rarity, power. Nothing abandons the round majority except sharp magical objects.</p></body></html>
