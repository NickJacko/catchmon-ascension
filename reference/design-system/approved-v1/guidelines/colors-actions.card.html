<!-- @dsCard group="Colors" viewport="700x160" name="Actions & borders" subtitle="Primary walnut with its depth edge, plus the border ladder" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:160px;box-sizing:border-box;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1}.chip{height:52px;border-radius:var(--radius-s);border:1px solid var(--border-hairline)}
.n{font:var(--type-label);color:var(--text-body);margin-top:6px;display:block}
.h{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle);display:block;margin-top:2px}
.tok{font-family:var(--font-numeric);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="sw"><div><div class="chip" style="background:#7B573D"></div><span class="n">primary</span><span class="h">--action-primary</span></div><div><div class="chip" style="background:#8B6446"></div><span class="n">hover</span><span class="h">#8B6446</span></div><div><div class="chip" style="background:#5E4029"></div><span class="n">press</span><span class="h">#5E4029</span></div><div><div class="chip" style="background:#4B3222"></div><span class="n">depth</span><span class="h">#4B3222</span></div><div><div class="chip" style="background:#B4514F"></div><span class="n">destructive</span><span class="h">#B4514F</span></div><div><div class="chip" style="background:#DCD5CB"></div><span class="n">disabled</span><span class="h">#DCD5CB</span></div></div><div class="sw" style="margin-top:10px"><div><div class="chip" style="height:22px;background:var(--surface-card);border:1px solid var(--border-hairline)"></div><span class="h">--border-hairline</span></div><div><div class="chip" style="height:22px;background:var(--surface-card);border:1px solid var(--border-default)"></div><span class="h">--border-default</span></div><div><div class="chip" style="height:22px;background:var(--surface-card);border:1px solid var(--border-strong)"></div><span class="h">--border-strong</span></div><div><div class="chip" style="height:22px;background:var(--surface-card);border:1px solid var(--border-premium)"></div><span class="h">--border-premium</span></div></div></body></html>
