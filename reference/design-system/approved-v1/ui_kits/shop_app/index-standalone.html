<script>window.CATCHMON_ICON_BASE="../../assets/icons/";</script>
<script>
(function(){
  var res = window.__resources || {};
  var cats = ["aquilor","betarion-prime","chronavelle","cogmino","dracogold","flameron","glacelyra","luraville","myrelith","nuttiki","obscidrahl","ripplee","terranox","venuscale","voidalon","zappiri"];
  var icons = ["coins","wind","package","chevron-left","chevron-right","store","hammer","sparkles","sparkle","image","map","settings","flame","droplet","zap","leaf","mountain","flask-conical","circle","snowflake","shield","eye","sun","moon","ghost","gem","orbit","lock","plus","check","clock","triangle-alert","info","hourglass","heart","hand-heart"];
  var art = {}, ic = {};
  cats.forEach(function(n){ if(res['art_'+n]) art[n+'.png'] = res['art_'+n]; });
  icons.forEach(function(n){ var k='ico_'+n.replace(/-/g,'_'); if(res[k]) ic[n]=res[k]; });
  window.__catchmonArt = art;
  window.CATCHMON_ICON_URLS = ic;
  // Redirect icon fetches to the inlined blobs (works regardless of bundle vintage).
  var nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    if (typeof input === 'string') {
      var m = input.match(/([a-z-]+)\.svg$/);
      if (m && ic[m[1]]) input = ic[m[1]];
    }
    return nativeFetch(input, init);
  };
})();
</script>

<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#7B573D"/><rect x="26" y="30" width="68" height="60" rx="10" fill="#FFF8EB"/><circle cx="60" cy="54" r="13" fill="#E7B85A"/><rect x="38" y="74" width="44" height="8" rx="4" fill="#D8B882"/></svg>

<div id="root"></div>
<script type="text/babel" data-presets="react">
(function(){
const { TopBar, TabBar, ShopFloorScreen, WorkshopScreen, CollectionScreen, CatchmonDetail, ProductSheet } = window;

function App(){
  const [tab,setTab]=React.useState('shop');
  const [product,setProduct]=React.useState(null);
  const [catchmon,setCatchmon]=React.useState(null);
  const [coins,setCoins]=React.useState(4820);
  const [toast,setToast]=React.useState(null);

  const buy=(p)=>{setCoins(c=>Math.max(0,c-p.price));setProduct(null);setToast(`${p.name} added to the shelf`);setTimeout(()=>setToast(null),2200)};
  const title = catchmon ? catchmon.name : tab==='shop' ? 'Sales Floor' : tab==='workshop' ? 'Workshop' : 'Catchmons';

  return (<div style={{display:'flex',flexDirection:'column',height:'100%',position:'relative'}}>
    <TopBar title={title} coins={coins} momentum={12} onBack={catchmon?()=>setCatchmon(null):undefined}/>
    <div className="scroll">
      {catchmon ? <CatchmonDetail catchmon={catchmon} onClose={()=>setCatchmon(null)}/>
        : tab==='shop' ? <ShopFloorScreen onSelectProduct={setProduct}/>
        : tab==='workshop' ? <WorkshopScreen/>
        : <CollectionScreen onSelect={setCatchmon}/>}
    </div>
    <TabBar value={tab} onChange={(t)=>{setCatchmon(null);setTab(t)}}/>
    <ProductSheet product={product} onClose={()=>setProduct(null)} onBuy={buy}/>
    {toast && <div style={{position:'absolute',left:16,right:16,bottom:88,zIndex:30,padding:'12px 16px',
      background:'var(--surface-inverse)',color:'var(--text-on-dark)',borderRadius:'var(--radius-m)',
      boxShadow:'var(--shadow-modal)',font:'var(--type-body-strong)',animation:'cs-sheet var(--dur-base) var(--ease-out)'}}>{toast}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script></body></html>
