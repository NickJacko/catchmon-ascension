<!-- @dsCard group="Shop App" viewport="390x844" name="Catchmon Shop · mobile" subtitle="Interactive shop floor, workshop and collection" -->
<!doctype html><html><head><meta charset="utf-8"><title>Catchmon Shop — mobile UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--cs-sand-300)}
body{display:grid;place-items:start center;min-height:100vh;font-family:var(--font-ui)}
#root{width:390px;height:844px;position:relative;overflow:hidden;background:var(--surface-app);box-shadow:var(--shadow-modal)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
@keyframes cs-sheet{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.CATCHMON_ICON_BASE="../../assets/icons/";</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="ShopFloorScreen.jsx"></script>
<script type="text/babel" src="WorkshopScreen.jsx"></script>
<script type="text/babel" src="CollectionScreen.jsx"></script>
<script type="text/babel" src="ProductSheet.jsx"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function(){
const { TopBar, TabBar, ShopFloorScreen, WorkshopScreen, CollectionScreen, CatchmonDetail, ProductSheet } = window;

function App(){
  const [tab,setTab]=React.useState('shop');
  const [product,setProduct]=React.useState(null);
  const [catchmon,setCatchmon]=React.useState(null);
  const [coins,setCoins]=React.useState(4820);
  const [toast,setToast]=React.useState(null);

  const buy=(p)=>{setCoins(c=>Math.max(0,c-p.price));setProduct(null);setToast(`${p.name} added to the shelf`);setTimeout(()=>setToast(null),2200)};
  const title = catchmon ? catchmon.name : tab==='shop' ? 'Sales Floor' : tab==='workshop' ? 'Workshop' : 'Catchmons';

  return (<div style={{display:'flex',flexDirection:'column',height:'100%',position:'relative'}}>
    <TopBar title={title} coins={coins} momentum={12} onBack={catchmon?()=>setCatchmon(null):undefined}/>
    <div className="scroll">
      {catchmon ? <CatchmonDetail catchmon={catchmon} onClose={()=>setCatchmon(null)}/>
        : tab==='shop' ? <ShopFloorScreen onSelectProduct={setProduct}/>
        : tab==='workshop' ? <WorkshopScreen/>
        : <CollectionScreen onSelect={setCatchmon}/>}
    </div>
    <TabBar value={tab} onChange={(t)=>{setCatchmon(null);setTab(t)}}/>
    <ProductSheet product={product} onClose={()=>setProduct(null)} onBuy={buy}/>
    {toast && <div style={{position:'absolute',left:16,right:16,bottom:88,zIndex:30,padding:'12px 16px',
      background:'var(--surface-inverse)',color:'var(--text-on-dark)',borderRadius:'var(--radius-m)',
      boxShadow:'var(--shadow-modal)',font:'var(--type-body-strong)',animation:'cs-sheet var(--dur-base) var(--ease-out)'}}>{toast}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script></body></html>
